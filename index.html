<title>Glam Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: a vanity mirror. The face sits in an oval "mirror" with bulb lights; the drawer of products slides below (phone) or beside (desktop). Single committed look: candy-boudoir pink. */
:root{
  --bg:#fde7ef; --bg2:#fbc8da; --mirror:#fff6f9; --ink:#5a2a3c; --muted:#9a6a7c;
  --accent:#ff4f8b; --accent2:#ffb3cc; --gold:#f5c66b; --card:#ffffff;
  --display:'Pacifico',cursive; --body:'Quicksand',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 30% 10%,#fff0f5 0,var(--bg) 40%,var(--bg2) 100%);color:var(--ink);font-family:var(--body);font-weight:500;overflow-x:hidden}
.wrap{min-height:100%;display:flex;flex-direction:column;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);margin:0;color:var(--accent);text-shadow:0 2px 0 #fff,0 4px 14px rgba(255,79,139,.35)}
.score{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.score b{color:var(--accent);font-size:16px}
main{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){main{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
/* Mirror */
.mirror{position:relative;background:var(--mirror);border-radius:48% 48% 40% 40%/30% 30% 20% 20%;box-shadow:0 0 0 10px #fff,0 0 0 14px var(--accent2),0 24px 50px rgba(120,40,70,.25);padding:14px;aspect-ratio:4/5;max-width:520px;width:100%;margin:0 auto;overflow:hidden;cursor:none;touch-action:none;user-select:none}
.mirror.hand{cursor:default}
.bulbs{position:absolute;inset:0;pointer-events:none}
.bulb{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff3c4;box-shadow:0 0 12px 4px #ffe27a;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1;box-shadow:0 0 18px 7px #ffe27a}}
.mirror #face{width:100%;height:100%;display:block}
.brush{position:absolute;width:22px;height:22px;pointer-events:none;transform:translate(-50%,-50%) rotate(-30deg);display:none;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.brush.on{display:block}
.spark{position:absolute;width:10px;height:10px;pointer-events:none;z-index:6;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(180deg);opacity:0}}
/* Drawer */
.drawer{background:var(--card);border-radius:28px;padding:14px;box-shadow:0 12px 30px rgba(120,40,70,.15);display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:var(--bg);color:var(--ink);font:700 13px var(--body);padding:9px 13px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:transform .15s,background .2s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected=true]{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(255,79,139,.4)}
.tab:focus-visible,.sw:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.sw{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font:600 11px var(--body);color:var(--muted)}
.sw .dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 8px rgba(90,42,60,.25);transition:transform .2s;display:grid;place-items:center;font-size:16px;overflow:hidden}
.sw:hover .dot{transform:scale(1.12) rotate(-6deg)}
.sw[aria-pressed=true] .dot{box-shadow:0 0 0 3px var(--accent),0 3px 8px rgba(90,42,60,.25);transform:scale(1.1)}
.sw .dot.none{background:repeating-linear-gradient(45deg,#eee 0 6px,#fff 6px 12px)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 16px;font:700 14px var(--body);cursor:pointer;background:var(--bg);color:var(--ink);transition:transform .15s;display:flex;gap:6px;align-items:center}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff8fb6);color:#fff;box-shadow:0 8px 18px rgba(255,79,139,.4)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffe3a3);color:#5a3b08}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Photo overlay */
.photo{position:fixed;inset:0;background:rgba(90,42,60,.6);display:none;place-items:center;z-index:30;padding:20px}
.photo.show{display:grid}
.frame{background:#fff;padding:14px 14px 50px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.4);transform:rotate(-3deg);animation:drop .5s cubic-bezier(.2,1.4,.4,1);max-width:min(92vw,380px);position:relative}
@keyframes drop{from{transform:rotate(8deg) scale(.5);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.frame svg{width:100%;height:auto;display:block;background:var(--mirror);border-radius:4px}
.frame p{font-family:var(--display);color:var(--accent);text-align:center;margin:12px 0 0;font-size:20px}
.frame .close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
/* face animations */
.eyelid{transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
.face-g{transition:transform .3s}
#skin,#lipsTop,#lipsBot,#blushL,#blushR,#shadowL,#shadowR,#hairMain,#hairFringe{transition:fill .35s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 cat:()=>`<g stroke="#ff4f8b" stroke-width="4" fill="rgba(255,200,230,.25)"><path d="M104 222 L194 230 L186 268 L112 262 Z"/><path d="M296 222 L206 230 L214 268 L288 262 Z"/><line x1="194" y1="238" x2="206" y2="238"/></g>`,
 heart:()=>`<g stroke="#ff4f8b" stroke-width="4" fill="rgba(255,79,139,.2)"><path d="M150 262 C125 245 115 230 128 218 C137 210 148 214 150 222 C152 214 163 210 172 218 C185 230 175 245 150 262Z"/><path d="M250 262 C225 245 215 230 228 218 C237 210 248 214 250 222 C252 214 263 210 272 218 C285 230 275 245 250 262Z"/><line x1="172" y1="235" x2="228" y2="235"/></g>`};

 flower:()=>`<g transform="translate(130,110)">${[0,60,120,180,240,300].map(a=>`<ellipse rx="9" ry="16" fill="#ff8fb6" transform="rotate(${a}) translate(0,-14)"/>`).join('')}<circle r="8" fill="#f5c66b"/></g>`,
 band:()=>`<path d="M105 150 C130 110 270 110 295 150" stroke="#58c7d6" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M105 150 C130 110 270 110 295 150" stroke="#ff4f8b" stroke-width="5" fill="none" stroke-dasharray="10 12"/>`};
const stickerSVG={none:()=>'',star:()=>`<text x="112" y="285" font-size="26">⭐</text>`,hearts:()=>`<text x="105" y="290" font-size="18">💕</text><text x="262" y="290" font-size="18">💕</text>`,
 freckles:()=>[...Array(14)].map((_,i)=>`<circle cx="${130+(i*23)%140}" cy="${275+(i*17)%30}" r="2" fill="#a56a4a" opacity=".7"/>`).join(''),
 gem:()=>`<g fill="#58c7d6" stroke="#fff"><path d="M120 212 l5 -8 l5 8 l-5 8Z"/><path d="M110 225 l4 -6 l4 6 l-4 6Z"/><path d="M280 212 l5 -8 l5 8 l-5 8Z"/><path d="M290 225 l4 -6 l4 6 l-4 6Z"/></g>`};

function render(){
 const s=state;
 $('#face').style.setProperty('--skin',s.skin);
 $('#blushL').setAttribute('fill',s.blush);$('#blushR').setAttribute('fill',s.blush);
 $('#shadowL').setAttribute('fill',s.shadow);$('#shadowR').setAttribute('fill',s.shadow);
 $('#linerL').setAttribute('stroke',s.liner);$('#linerR').setAttribute('stroke',s.liner);
 $('#lashes').setAttribute('opacity',s.liner==='transparent'?0:1);
 $('#irisL').setAttribute('fill',s.eyes);$('#irisR').setAttribute('fill',s.eyes);
 $('#lipsTop').setAttribute('fill',s.lips);$('#lipsBot').setAttribute('fill',s.lips);
 $('#lipGloss').setAttribute('opacity',s.lips==='#d9958a'?0:1);
 $('#hairBack').innerHTML=hairBack[s.hairStyle](s.hairColor);
 $('#hairFront').innerHTML=hairFront[s.hairStyle](s.hairColor);
 $('#hairShine').innerHTML=hairFront[s.hairStyle]('url(#hairShine)').replace(/<circle[^>]*>/g,'');
 const bc=s.hairColor==='#e9c27c'?'#8a6a3a':s.hairColor==='#f2f0ee'?'#888':'#4a2e24';$('#browL').setAttribute('fill',bc);$('#browR').setAttribute('fill',bc);
 $('#earrings').innerHTML=earringSVG[s.earrings]();
 $('#glasses').innerHTML=glassSVG[s.glasses]();
 $('#hat').innerHTML=hatSVG[s.hat]();
 $('#stickers').innerHTML=stickerSVG[s.stickers]();
 $('#points').textContent=points;
 markPressed();
}
function apply(id,val,label){
 if(state[id]===val)return;
 history.push({...state});if(history.length>30)history.shift();
 state[id]=val;points+=val==='transparent'||val==='none'?0:10;
 render();burst();toast(label);
 const brushColor=/^#/.test(val)?val:'#ff8fb6';$('#brushTip').setAttribute('fill',brushColor);
}
function markPressed(){document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.val===state[cur]))}

/* ---------- Drawer ---------- */
const tabs=$('#tabs');
cats.forEach(c=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.textContent=c.label;b.dataset.id=c.id;b.onclick=()=>select(c.id);tabs.appendChild(b)});
function select(id){cur=id;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===id));
 const c=cats.find(x=>x.id===id);$('#panelTitle').textContent=c.label.replace(/^\S+\s/,'');
 const box=$('#swatches');box.innerHTML='';
 c.opts.forEach(([val,label])=>{const b=document.createElement('button');b.className='sw';b.dataset.val=val;
  const d=document.createElement('span');d.className='dot';
  if(c.type==='color'){val==='transparent'?d.classList.add('none'):d.style.background=val;}else{d.style.background='var(--bg)';d.textContent=icons[val]||'•'}
  b.appendChild(d);b.appendChild(document.createTextNode(label));b.onclick=()=>apply(id,val,label);box.appendChild(b)});
 markPressed()}

/* ---------- Effects ---------- */
const mirror=$('#mirror'),brush=$('#brush');
mirror.addEventListener('pointermove',e=>{if(touch)return;const r=mirror.getBoundingClientRect();brush.classList.add('on');brush.style.left=(e.clientX-r.left)+'px';brush.style.top=(e.clientY-r.top)+'px'});
mirror.addEventListener('pointerleave',()=>brush.classList.remove('on'));
mirror.addEventListener('pointerdown',e=>{const r=mirror.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top,8)});
const touch=!matchMedia('(pointer:fine)').matches;if(touch)mirror.classList.add('hand');
const sparkShapes=['✦','✧','❤','★','•'];
function burst(x,y,n=14){const r=mirror.getBoundingClientRect();x=x??r.width/2;y=y??r.height/2;
 for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=sparkShapes[i%5];
  s.style.left=x+'px';s.style.top=y+'px';s.style.color=['#ff4f8b','#f5c66b','#58c7d6','#fff','#b57edc'][i%5];s.style.fontSize=(10+Math.random()*14)+'px';
  const a=Math.random()*Math.PI*2,d=40+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
  mirror.appendChild(s);setTimeout(()=>s.remove(),900)}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1200)}
const bulbs=$('#bulbs');for(let i=0;i<14;i++){const a=(i/14)*Math.PI*2;const b=document.createElement('span');b.className='bulb';b.style.left=`calc(50% + ${Math.cos(a)*47}% - 7px)`;b.style.top=`calc(50% + ${Math.sin(a)*47}% - 7px)`;b.style.animationDelay=(i*.17)+'s';bulbs.appendChild(b)}

/* ---------- Buttons ---------- */
$('#undo').onclick=()=>{if(!history.length)return toast('Rien à annuler');state=history.pop();render();toast('Annulé')};
$('#reset').onclick=()=>{history.push({...state});state={...def};points=0;render();burst();toast('Visage tout propre !')};
const pick=a=>a[Math.floor(Math.random()*a.length)][0];
$('#random').onclick=()=>{history.push({...state});
 state={skin:pick(skins),blush:pick(blush.slice(1)),shadow:pick(shadows.slice(1)),liner:pick(liners.slice(1)),eyes:pick(eyes),lips:pick(lips),hairStyle:pick(hairStyles),hairColor:pick(hairColors),earrings:pick(earrings),glasses:pick(glasses),hat:pick(hats),stickers:pick(stickers)};
 points+=50;render();burst(null,null,30);toast('Look surprise ! +50 ✨')};
$('#photo').onclick=()=>{$('#photoSvg').innerHTML=$('#face').outerHTML;$('#photoBox').classList.add('show');burst(null,null,25)};
$('#closePhoto').onclick=()=>$('#photoBox').classList.remove('show');
$('#photoBox').addEventListener('click',e=>{if(e.target.id==='photoBox')$('#photoBox').classList.remove('show')});

select('skin');render();
</script>

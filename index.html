<title>Glam Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: a vanity mirror. The model sits in a lit mirror; the drawer of products sits below (phone) or beside (desktop). Single committed look: candy-boudoir pink. */
:root{
  --bg:#fde7ef; --bg2:#fbc8da; --mirror:#fff6f9; --ink:#5a2a3c; --muted:#9a6a7c;
  --accent:#ff4f8b; --accent2:#ffb3cc; --gold:#f5c66b; --card:#ffffff;
  --display:'Pacifico',cursive; --body:'Quicksand',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 30% 10%,#fff0f5 0,var(--bg) 40%,var(--bg2) 100%);color:var(--ink);font-family:var(--body);font-weight:500;overflow-x:hidden}
.wrap{min-height:100%;display:flex;flex-direction:column;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);margin:0;color:var(--accent);text-shadow:0 2px 0 #fff,0 4px 14px rgba(255,79,139,.35)}
.score{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.score b{color:var(--accent);font-size:16px}
main{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){main{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
/* Mirror */
.mirror{position:relative;background:radial-gradient(circle at 50% 32%,#ffffff 0,#ffeef4 55%,#f8cfe0 100%);border-radius:46% 46% 30px 30px/28% 28% 30px 30px;box-shadow:0 0 0 10px #fff,0 0 0 14px var(--accent2),0 24px 50px rgba(120,40,70,.25);aspect-ratio:4/5;max-width:520px;width:100%;margin:0 auto;overflow:hidden;cursor:none;touch-action:none;user-select:none}
.mirror.hand{cursor:default}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:2}
.bulb{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff3c4;box-shadow:0 0 12px 4px #ffe27a;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1;box-shadow:0 0 18px 7px #ffe27a}}
.mirror #face{width:100%;height:100%;display:block}
.brush{position:absolute;width:22px;height:22px;pointer-events:none;transform:translate(-50%,-50%) rotate(-30deg);display:none;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.brush.on{display:block}
.spark{position:absolute;width:10px;height:10px;pointer-events:none;z-index:6;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(180deg);opacity:0}}
/* Drawer */
.drawer{background:var(--card);border-radius:28px;padding:14px;box-shadow:0 12px 30px rgba(120,40,70,.15);display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{flex:0 0 auto;border:0;background:var(--bg);color:var(--ink);font:700 12px var(--body);padding:8px 11px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:transform .15s,background .2s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected=true]{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(255,79,139,.4)}
.tab:focus-visible,.sw:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.sw{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font:600 11px var(--body);color:var(--muted)}
.sw .dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 8px rgba(90,42,60,.25);transition:transform .2s;display:grid;place-items:center;font-size:16px;overflow:hidden}
.sw:hover .dot{transform:scale(1.12) rotate(-6deg)}
.sw[aria-pressed=true] .dot{box-shadow:0 0 0 3px var(--accent),0 3px 8px rgba(90,42,60,.25);transform:scale(1.1)}
.sw .dot.none{background:repeating-linear-gradient(45deg,#eee 0 6px,#fff 6px 12px)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 16px;font:700 14px var(--body);cursor:pointer;background:var(--bg);color:var(--ink);transition:transform .15s;display:flex;gap:6px;align-items:center}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff8fb6);color:#fff;box-shadow:0 8px 18px rgba(255,79,139,.4)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffe3a3);color:#5a3b08}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Photo overlay */
.photo{position:fixed;inset:0;background:rgba(90,42,60,.6);display:none;place-items:center;z-index:30;padding:20px}
.photo.show{display:grid}
.frame{background:#fff;padding:14px 14px 50px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.4);transform:rotate(-3deg);animation:drop .5s cubic-bezier(.2,1.4,.4,1);max-width:min(92vw,380px);position:relative}
@keyframes drop{from{transform:rotate(8deg) scale(.5);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.frame svg{width:100%;height:auto;max-height:66vh;display:block;background:radial-gradient(circle at 50% 30%,#fff,#ffe6ef);border-radius:4px}
.frame p{font-family:var(--display);color:var(--accent);text-align:center;margin:12px 0 0;font-size:20px}
.frame .close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
/* Blink */
.eyelid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(0)}97.5%{transform:scaleY(1)}}
/* Steps */
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex-wrap:wrap}
.steps span{padding:6px 10px;border-radius:999px;background:#fff}
.steps span.on{background:var(--accent);color:#fff}
.steps i{opacity:.5;font-style:normal}
/* Dressing */
.dressing{position:relative;background:radial-gradient(circle at 50% 25%,#ffffff,#ffe4ee 70%,#f8cfe0);border-radius:28px;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--accent2),0 24px 50px rgba(120,40,70,.2);padding:10px;max-width:420px;width:100%;margin:0 auto;overflow:hidden}
.dressing svg{width:100%;height:auto;display:block;position:relative;max-height:76vh}
/* Podium */
.podium{position:relative;background:radial-gradient(ellipse at 50% 0,#4a1d3a,#1c0a18 70%);border-radius:28px;overflow:hidden;max-width:520px;width:100%;margin:0 auto;aspect-ratio:3/4;box-shadow:0 30px 60px rgba(60,10,40,.5)}
.spot{position:absolute;top:-10%;width:40%;height:120%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:top center;animation:sweep 4s ease-in-out infinite alternate;pointer-events:none}
.spot.a{left:5%;animation-delay:-1s}.spot.b{left:30%;animation-delay:-2.5s}.spot.c{left:55%}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.stage{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,#ff6aa8,#c2185b);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.stage::after{content:"";position:absolute;left:0;right:0;top:0;height:30%;background:rgba(255,255,255,.35)}
.model{position:absolute;left:50%;bottom:13%;height:72%;transform:translateX(-50%);animation:walk 1.3s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 12px 10px rgba(0,0,0,.45));will-change:transform}
.model svg{height:100%;width:auto;display:block}
@keyframes walk{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.2deg)}50%{transform:translateX(-50%) translateY(-8px) rotate(1.2deg)}}
.banner{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,34px);color:#ffe3a3;text-shadow:0 0 20px #ff4f8b,0 2px 0 #7a1b4a}
.stars{position:absolute;top:60px;left:0;right:0;text-align:center;color:#ffd166;font-size:22px;letter-spacing:4px;text-shadow:0 0 12px #ff9}
.confetti{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
.center{justify-content:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="defs"></div>
<div class="wrap">
<header>
  <h1>Glam Studio ✨</h1>
  <div class="score">Glam points <b id="points">0</b></div>
</header>
<div class="steps" id="steps"><span class="on">1 Maquillage</span><i>›</i><span>2 Dressing</span><i>›</i><span>3 Podium</span></div>

<section id="step1">
<main>
  <div class="mirror" id="mirror">
    <div class="bulbs" id="bulbs"></div>
    <svg id="face" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-label="Mannequin à maquiller"></svg>
    <svg class="brush" id="brush" viewBox="0 0 52 52"><rect x="22" y="22" width="8" height="28" rx="4" fill="#5a2a3c"/><ellipse id="brushTip" cx="26" cy="14" rx="12" ry="14" fill="#ff8fb6"/></svg>
  </div>
  <aside class="drawer">
    <div class="tabs" role="tablist" id="tabs"></div>
    <p class="panel-title" id="panelTitle">Teint</p>
    <div class="swatches" id="swatches"></div>
    <div class="actions">
      <button class="btn" id="undo">↩ Annuler</button>
      <button class="btn gold" id="random">🎲 Look surprise</button>
      <button class="btn" id="reset">🧼 Démaquiller</button>
      <button class="btn" id="photo">📸 Photo</button>
      <button class="btn primary" id="next1">Suivant : Habiller 👗</button>
    </div>
  </aside>
</main>
</section>

<section id="step2" hidden>
<main>
  <div class="dressing" id="dressing">
    <svg id="body" viewBox="0 0 400 1000" xmlns="http://www.w3.org/2000/svg" aria-label="Mannequin à habiller"></svg>
  </div>
  <aside class="drawer">
    <div class="tabs" role="tablist" id="tabs2"></div>
    <p class="panel-title" id="panelTitle2">Robe</p>
    <div class="swatches" id="swatches2"></div>
    <div class="actions">
      <button class="btn" id="back2">← Maquillage</button>
      <button class="btn" id="undo2">↩ Annuler</button>
      <button class="btn gold" id="random2">🎲 Tenue surprise</button>
      <button class="btn primary" id="next2">Défilé sur le podium ✨</button>
    </div>
  </aside>
</main>
</section>

<section id="step3" hidden>
<main style="grid-template-columns:1fr">
  <div class="podium" id="podium">
    <div class="spot a"></div><div class="spot b"></div><div class="spot c"></div>
    <div class="banner">Glam Fashion Show</div>
    <div class="stars" id="stars">★★★★★</div>
    <div class="stage"></div>
    <div class="model" id="model"></div>
  </div>
  <div class="actions center">
    <button class="btn" id="back3">← Dressing</button>
    <button class="btn" id="photo3">📸 Photo</button>
    <button class="btn gold" id="again">🎲 Nouveau look</button>
    <button class="btn primary" id="restart">🧼 Recommencer</button>
  </div>
</main>
</section>
</div>
<div class="toast" id="toast"></div>
<div class="photo" id="photoBox"><div class="frame"><button class="close" id="closePhoto" aria-label="Fermer">×</button><div id="photoSvg"></div><p>Mon look du jour 💕</p></div></div>

<script>
const $=s=>document.querySelector(s);
/* ================= Geometry ================= */
const SH='#5a2010';                                   // warm shadow tone, works on every skin
const Mx=s=>`<g transform="translate(400,0) scale(-1,1)">${s}</g>`;
const both=s=>s+Mx(s);
const FACE='M200 70 C140 70 102 112 100 180 C99 215 102 250 108 280 C114 315 130 345 152 368 C168 384 184 392 200 392 C216 392 232 384 248 368 C270 345 286 315 292 280 C298 250 301 215 300 180 C298 112 260 70 200 70Z';
const EYE='M133 229 C142 215 166 213 179 234 C170 242 148 244 133 229Z';
const BROW='M182 202 C172 197 158 194 146 194 C137 194 129 197 122 204.5 C130 200.2 139 199 147 199.3 C160 200 172 203 181 208.5 C183 207 183.5 204 182 202Z';
const ES='translate(156 229) scale(1.1) translate(-156 -229)';
const LIPT='M168 331 C176 326 186 320 193 319.5 C196 319.3 198 321 200 322 C202 321 204 319.3 207 319.5 C214 320 224 326 232 331 C220 331.5 210 332.5 200 332.5 C190 332.5 180 331.5 168 331Z';
const LIPB='M168 331 C180 331.5 190 332.5 200 332.5 C210 332.5 220 331.5 232 331 C226 341 214 348 200 348 C186 348 174 341 168 331Z';
const EAR='M102 214 C91 206 84 220 86 240 C88 260 93 276 100 286 C104 290 106.500 284 106 276Z';
const BUST='M156 330 L156 386 C156 410 150 424 128 432 C90 444 40 454 0 476 L0 500 L400 500 L400 476 C360 454 310 444 272 432 C250 424 244 410 244 386 L244 330Z';
const TORSO='M198 136 L217 136 L217 156 C219 166 236 171 256 177 C272 182 282 196 283 214 L262 238 C264 262 262 285 256 305 C250 325 246 338 246 352 C247 385 268 415 275 452 C279 480 280 510 278 540 C276 610 262 660 252 702 C248 730 253 765 250 800 C246 850 237 895 234 930 C236 946 244 964 242 974 C234 980 214 980 207 974 C205 962 210 946 211 930 C208 890 201 840 203 792 C204 762 210 732 209 702 C206 640 203 570 198 508Z';
const ARM='M256 177 C276 182 284 198 284 216 C288 250 293 310 292 350 C297 400 300 450 297 492 C303 510 304 538 297 558 C293 568 285 567 282 557 C277 540 278 512 281 492 C278 450 270 400 266 352 C263 312 261 272 260 236Z';
const MT='translate(400,0) scale(-1,1)';

/* ================= Shared defs (kept outside the steps so clones keep working) ================= */
const blur=n=>`<filter id="b${n}" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="${n}"/></filter>`;
const inner=(id,sd,col,op)=>`<filter id="${id}" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="${sd}" result="b"/><feComponentTransfer in="b" result="i"><feFuncA type="linear" slope="-1.6" intercept="1.6"/></feComponentTransfer><feFlood flood-color="${col}" flood-opacity="${op}"/><feComposite in2="i" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="s"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s"/></feMerge></filter>`;
$('#defs').innerHTML=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<clipPath id="faceClip"><path d="${FACE}"/></clipPath>
<clipPath id="eyeClip"><path d="${EYE}"/></clipPath>
<clipPath id="bustClip"><path d="${BUST}"/></clipPath>
<clipPath id="bodyClip"><path d="${TORSO}"/><path d="${ARM}"/><path d="${TORSO}" transform="${MT}"/><path d="${ARM}" transform="${MT}"/></clipPath>
<radialGradient id="irisG"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".42" stop-color="#000" stop-opacity=".1"/><stop offset=".62" stop-color="#fff" stop-opacity=".14"/><stop offset=".86" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
<radialGradient id="scleraG" cx=".5" cy=".55" r=".6"><stop offset=".45" stop-color="#f6f1ee"/><stop offset="1" stop-color="#cdbdb8"/></radialGradient>
<radialGradient id="pearl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfc4c0"/></radialGradient>
<linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#e9b949"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
${[1,2,3,6,8].map(blur).join('')}
<filter id="b05" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation=".6"/></filter>
${inner('inF',12,SH,.5)}${inner('inS',7,SH,.45)}${inner('inH',7,'#000',.45)}${inner('inC',6,'#000',.3)}
</defs></svg>`;

/* ================= Face ================= */
const fibres=Array.from({length:30},(_,i)=>{const a=i/30*6.2832,r2=10.5+(i%3);return `<line x1="${(156+Math.cos(a)*5.5).toFixed(1)}" y1="${(227.5+Math.sin(a)*5.5).toFixed(1)}" x2="${(156+Math.cos(a)*r2).toFixed(1)}" y2="${(227.5+Math.sin(a)*r2).toFixed(1)}" stroke="#fff" stroke-opacity=".17" stroke-width=".7"/>`}).join('');
const eyeArea=`<g transform="${ES}">
 <ellipse cx="156" cy="221" rx="33" ry="15" fill="${SH}" opacity=".1" filter="url(#b6)"/>
 <path d="M124 233 C126 191 177 185 189 233 C174 208 140 209 124 233Z" style="fill:var(--shadow)" opacity=".4" filter="url(#b6)"/>
 <path d="M129 231 C132 201 172 193 184 231 C172 211 142 212 129 231Z" style="fill:var(--shadow)" opacity=".85" filter="url(#b3)"/></g>`;
const eye=`
 <g filter="url(#b05)" opacity=".9"><path d="${BROW}" style="fill:var(--hair)"/><path d="${BROW}" fill="#000" opacity=".25"/></g>
 <g transform="${ES}"><path d="${EYE}" fill="url(#scleraG)"/>
 <g clip-path="url(#eyeClip)">
  <circle cx="156" cy="227.5" r="13" style="fill:var(--iris)"/>${fibres}
  <circle cx="156" cy="227.5" r="13" fill="url(#irisG)"/>
  <circle cx="156" cy="227.5" r="5.2" fill="#0b0808"/>
  <path d="M133 229 C142 215 166 213 179 234" fill="none" stroke="#2a1410" stroke-opacity=".5" stroke-width="8" filter="url(#b2)"/>
  <ellipse cx="176.5" cy="234" rx="3.5" ry="2.4" fill="#e3a59b" opacity=".85"/>
 </g>
 <path d="M179 234 C170 242 148 244 133 229" fill="none" stroke="#a8665a" stroke-opacity=".55" stroke-width="1"/>
 <path d="M137 221 C146 205 166 204 180 223" fill="none" stroke="${SH}" stroke-opacity=".42" stroke-width="1.6" filter="url(#b1)"/>
 <path d="M138 244 C150 251 168 250 178 243" fill="none" stroke="${SH}" stroke-opacity=".1" stroke-width="3" filter="url(#b2)"/>
 <path d="M179 234 C166 212 142 213.5 132 228.5 L121 219.5 C127 226 131 226.5 134 224.5 C143 217 165 216.500 179 234Z" style="fill:var(--liner)"/>
 <path d="M179 234 C166 212.800 142 214.300 131.500 229.500 C142 217.200 165 216.200 179 234Z" fill="#1d1211"/>
 <g class="lashes"></g>
 <g class="eyelid"><path d="${EYE}" style="fill:var(--skin)"/><path d="${EYE}" style="fill:var(--shadow)" opacity=".7"/><path d="M179 234 C170 242 148 244 133 229" fill="none" stroke="#1d1211" stroke-width="1.6"/></g></g>`;
$('#face').innerHTML=`
<g id="hairBack"></g>
<g id="bust">
 <path d="${BUST}" style="fill:var(--skin)" filter="url(#inF)"/>
 <g clip-path="url(#bustClip)">
  <path d="${FACE}" transform="translate(0,24)" fill="${SH}" opacity=".42" filter="url(#b8)"/>
  ${both(`<path d="M194 462 C170 452 130 452 84 468" fill="none" stroke="${SH}" stroke-opacity=".3" stroke-width="5" filter="url(#b3)"/><path d="M188 472 C168 464 130 464 92 478" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="5" filter="url(#b3)"/><path d="M170 404 C176 432 186 452 196 466" fill="none" stroke="${SH}" stroke-opacity=".07" stroke-width="6" filter="url(#b3)"/>`)}
 </g>
</g>
<g id="head">
 ${both(`<path d="${EAR}" style="fill:var(--skin)" filter="url(#inS)"/><path d="M96 226 C93 242 96 260 101 272" fill="none" stroke="${SH}" stroke-opacity=".35" stroke-width="2.2" filter="url(#b1)"/>`)}
 <path d="${FACE}" style="fill:var(--skin)" filter="url(#inF)"/>
 <g clip-path="url(#faceClip)">
  <ellipse cx="200" cy="150" rx="54" ry="30" fill="#ffe6cc" opacity=".2" filter="url(#b8)"/>
  <ellipse cx="200" cy="374" rx="16" ry="9" fill="#ffe6cc" opacity=".16" filter="url(#b6)"/>
  ${both(`<ellipse cx="138" cy="262" rx="22" ry="10" transform="rotate(-20 138 262)" fill="#ffe6cc" opacity=".16" filter="url(#b6)"/>
  <ellipse cx="122" cy="318" rx="14" ry="34" transform="rotate(-24 122 318)" fill="${SH}" opacity=".16" filter="url(#b8)"/>
  <ellipse cx="135" cy="284" rx="30" ry="14" transform="rotate(-20 135 284)" style="fill:var(--blush)" opacity=".42" filter="url(#b8)"/>${eyeArea}`)}
  <g id="hairShadow" transform="translate(0,9)" opacity=".3" filter="url(#b6)"></g>
 </g>
 ${both(eye)}
 <circle cx="161" cy="221.5" r="3" fill="#fff" opacity=".95"/><circle cx="151" cy="232.5" r="1.4" fill="#fff" opacity=".5"/>
 <circle cx="249" cy="221.5" r="3" fill="#fff" opacity=".95"/><circle cx="239" cy="232.5" r="1.4" fill="#fff" opacity=".5"/>
 <path d="M189 222 C187 250 186 268 181 286" fill="none" stroke="${SH}" stroke-opacity=".22" stroke-width="7" filter="url(#b3)"/>
 <path d="M211 222 C213 250 214 268 219 286" fill="none" stroke="${SH}" stroke-opacity=".12" stroke-width="7" filter="url(#b3)"/>

function lashSVG(kind){
 const m={nat:.5,vol:.8,glam:1.15}[kind]||.5,w={nat:.65,vol:.9,glam:1.1}[kind]||.65,n={nat:8,vol:11,glam:13}[kind]||8,span=kind==='nat'?.6:.78;
 const B=(p,t)=>{const u=1-t;return[u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]]};
 const up=[[133,229],[142,215],[166,213],[179,234]];
 let s=`<g fill="none" stroke="#1d1211" stroke-linecap="round" stroke-width="${w}">`;
 for(let i=0;i<n;i++){const t=.03+i*(span/(n-1)),[x,y]=B(up,t),[x2,y2]=B(up,t+.01);let tx=x2-x,ty=y2-y,l=Math.hypot(tx,ty);tx/=l;ty/=l;
  const nx=ty,ny=-tx;let dx=nx-.6*(1-t),dy=ny;l=Math.hypot(dx,dy);dx/=l;dy/=l;const len=(2.5+5.5*Math.sin(Math.PI*Math.min(1,t*1.6+.25)))*m;
  s+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${(x+nx*len*.6).toFixed(1)} ${(y+ny*len*.6).toFixed(1)} ${(x+dx*len).toFixed(1)} ${(y+dy*len-len*.15).toFixed(1)}"/>`}
 return s+'</g>';
}

/* ================= Render ================= */
const strip=h=>h.replace(/ id="[^"]*"/g,'');
function setVars(el){const s=state,st=el.style;
 st.setProperty('--skin',s.skin);st.setProperty('--blush',s.blush);st.setProperty('--shadow',s.shadow);st.setProperty('--liner',s.liner);st.setProperty('--iris',s.eyes);st.setProperty('--hair',s.hairColor);

function render(){
 const s=state;setVars($('#face'));setVars($('#body'));
 const h=hair(s.hairStyle,s.hairColor);
 $('#hairBack').innerHTML=h.back;$('#hairFront').innerHTML=h.front;$('#hairShadow').innerHTML=h.sh;
 const L=lashSVG(s.lash);document.querySelectorAll('#face .lashes').forEach(e=>e.innerHTML=L);
 $('#earrings').innerHTML=earringSVG[s.earrings]();$('#glasses').innerHTML=glassSVG[s.glasses]();
 $('#hat').innerHTML=hatSVG[s.hat]();$('#stickers').innerHTML=stickerSVG[s.stickers]();
 $('#backSlot').innerHTML=strip($('#hairBack').innerHTML);$('#headSlot').innerHTML=strip($('#head').innerHTML);
 const dressed=s.dress!=='none';
 $('#dress').innerHTML=dressSVG[s.dress](s.topColor);
 $('#topG').innerHTML=dressed?'':topSVG[s.top](s.topColor);
 $('#bottom').innerHTML=dressed?'':bottomSVG[s.bottom](s.bottomColor);

function apply(id,val,label){
 if(state[id]===val)return;
 history.push({...state});if(history.length>40)history.shift();
 state[id]=val;points+=val==='transparent'||val==='none'?0:10;
 render();if(step===1)burst();toast(label);
 if(/^#/.test(val))$('#brushTip').setAttribute('fill',val);
}
function markPressed(){document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.val===state[cur]))}

/* ================= Drawers ================= */
function drawer(list,tabsEl,titleEl,boxEl){
 const sel=id=>{cur=id;tabsEl.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===id));
  const c=list.find(x=>x.id===id);titleEl.textContent=c.label.replace(/^\S+\s/,'');boxEl.innerHTML='';
  c.opts.forEach(([val,label,sw])=>{const b=document.createElement('button');b.className='sw';b.dataset.val=val;
   const d=document.createElement('span');d.className='dot';
   if(c.type==='color'){val==='transparent'?d.classList.add('none'):d.style.background=sw||val}else{d.style.background='var(--bg)';d.textContent=icons[val]||'•'}
   b.appendChild(d);b.appendChild(document.createTextNode(label));b.onclick=()=>apply(id,val,label);boxEl.appendChild(b)});
  markPressed()};
 list.forEach(c=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.textContent=c.label;b.dataset.id=c.id;b.onclick=()=>sel(c.id);tabsEl.appendChild(b)});
 return sel}

/* ================= Effects ================= */
const mirror=$('#mirror'),brush=$('#brush');
const touch=!matchMedia('(pointer:fine)').matches;if(touch)mirror.classList.add('hand');
mirror.addEventListener('pointermove',e=>{if(touch)return;const r=mirror.getBoundingClientRect();brush.classList.add('on');brush.style.left=(e.clientX-r.left)+'px';brush.style.top=(e.clientY-r.top)+'px'});
mirror.addEventListener('pointerleave',()=>brush.classList.remove('on'));
mirror.addEventListener('pointerdown',e=>{const r=mirror.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top,8)});
const sparkShapes=['✦','✧','❤','★','•'];
function burst(x,y,n=12){const r=mirror.getBoundingClientRect();x=x??r.width/2;y=y??r.height/2;
 for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=sparkShapes[i%5];
  s.style.left=x+'px';s.style.top=y+'px';s.style.color=['#ff4f8b','#f5c66b','#58c7d6','#fff','#b57edc'][i%5];s.style.fontSize=(10+Math.random()*14)+'px';
  const a=Math.random()*Math.PI*2,d=40+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
  mirror.appendChild(s);setTimeout(()=>s.remove(),900)}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1200)}
const bulbs=$('#bulbs');for(let i=0;i<9;i++){const a=Math.PI+(i/8)*Math.PI;const b=document.createElement('span');b.className='bulb';b.style.left=`calc(50% + ${Math.cos(a)*46}% - 6px)`;b.style.top=`calc(36% + ${Math.sin(a)*33}% - 6px)`;b.style.animationDelay=(i*.17)+'s';bulbs.appendChild(b)}
function confetti(){const p=$('#podium');for(let i=0;i<60;i++){const c=document.createElement('span');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ff4f8b','#f5c66b','#58c7d6','#fff','#b57edc'][i%5];c.style.animationDuration=(2.5+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*1.5)+'s';p.appendChild(c);setTimeout(()=>c.remove(),5000)}}
